<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
      --primary: #25D366;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .gallery {
      width: 100%;
      max-width: 900px; /* ajusta este valor si quieres la tarjeta más grande o pequeña */
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      width: 100%;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }

    .image-wrapper:hover img {
      transform: scale(1.04);
    }

    .loader {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e5e7eb;
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Área clickable del QR */
    .qr-overlay-link {
      position: absolute;
      bottom: 80%;
      right: 10%;
      width: 10%;
      height: 10%;
      transform: translate(10%, 10%);
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .qr-overlay-link:hover {
      opacity: 0.04;
      background: rgba(37,211,102,0.04);
    }

    @media (max-width: 640px) {
      .whatsapp-fab {
        bottom: 16px;
        right: 16px;
        width: 60px;
        height: 60px;
      }
      .whatsapp-icon {
        width: 36px;
        height: 36px;
      }
      .qr-overlay-link {
        width: 32%;
        height: 32%;
        transform: translate(8%, 8%);
      }
    }

    /* ==================================================
       SOLO LO NUEVO AGREGADO PARA EL BOTÓN DE GMAIL
    ================================================== */

    .gmail-fab {
      position: fixed;
      bottom: 24px;
      right: 100px; /* se coloca a la izquierda del botón WhatsApp */
      width: 68px;
      height: 68px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 9999;
      transition: var(--transition);
    }

    .gmail-fab:hover {
      transform: scale(1.12) translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }

    .gmail-fab:active {
      transform: scale(0.96);
    }

    .gmail-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .gmail-fab::after {
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }

    .gmail-fab:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(-8px);
    }

    @media (max-width: 640px) {
      .gmail-fab {
        bottom: 16px;
        right: 84px;
        width: 60px;
        height: 60px;
      }
      .gmail-icon {
        width: 36px;
        height: 36px;
      }
    }

      /* Botón WhatsApp flotante */
    .whatsapp-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 68px;
      height: 68px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
      cursor: pointer;
      z-index: 9999;
      transition: var(--transition);
    }

    .whatsapp-fab:hover {
      transform: scale(1.12) translateY(-4px);
      box-shadow: 0 12px 32px rgba(37,211,102,0.45);
    }

    .whatsapp-fab:active {
      transform: scale(0.96);
    }

    .whatsapp-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .whatsapp-fab::after {
      content: " ";
      position: absolute;
      right: 90px;
      top: 50%;
      transform: translateY(-50%);
      background: #111;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }

    .whatsapp-fab:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(-8px);
    }

  </style>
</head>
<body>

  <div class="gallery">
    <div class="center">
      <div class="image-wrapper" style="position: relative;">
        <div class="loader"><div class="spinner"></div></div>
        <img src="1.png" alt="Tarjeta con QR" loading="lazy"
             onload="this.parentElement.querySelector('.loader').classList.add('hidden')">
        <a href="https://tarjeta360empresarial-dotcom.github.io/Targeta/"
           target="_blank" rel="noopener noreferrer"
           class="qr-overlay-link"
           title="Visitar página web"
           aria-label="Abrir web desde el QR">
        </a>
      </div>
    </div>
  </div>

  <!-- Botón WhatsApp con imagen -->
  <a href="https://wa.me/528332932881?text=Hola,%20estoy%20interesado"
     class="whatsapp-fab" target="_blank" rel="noopener noreferrer">
    <img src="WhatsApp.png" alt="WhatsApp" class="whatsapp-icon">
  </a>

 <!-- Botón Gmail (mismo mensaje prellenado) -->
<a href="mailto:ventas.tressesentaconsultoria@gmail.com?subject=Interesado%20en%20tus%20servicios&body=Hola,%20estoy%20interesado"
   class="gmail-fab" target="_blank" rel="noopener noreferrer">
  <img src="gmail.png" alt="Gmail" class="gmail-icon">
</a>

</body>
</html>
