<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
      --primary: #25D366;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1f2937;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }

    .image-wrapper {
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }

    .image-wrapper:hover img { transform: scale(1.04); }

    .loader {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #e5e7eb;
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .whatsapp-fab {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 68px; height: 68px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
      cursor: pointer;
      z-index: 9999;
      transition: var(--transition);
    }

    .whatsapp-fab:hover { transform: scale(1.12) translateY(-4px); box-shadow: 0 12px 32px rgba(37,211,102,0.45); }
    .whatsapp-fab:active { transform: scale(0.96); }

    .whatsapp-fab svg { width: 40px; height: 40px; fill: currentColor; }

    .whatsapp-fab::after {
      content: "Chatea por WhatsApp";
      position: absolute;
      right: 90px; top: 50%;
      transform: translateY(-50%);
      background: #111; color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: all 0.3s;
    }
    .whatsapp-fab:hover::after { opacity: 1; transform: translateY(-50%) translateX(-8px); }

    .qr-overlay-link {
      position: absolute;
      bottom: 40%;
      right: 5%;
      width: 30%;
      height: 30%;
      transform: translate(10%, 10%);
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .qr-overlay-link:hover { opacity: 0.04; background: rgba(37,211,102,0.04); }

    @media (max-width: 640px) {
      .whatsapp-fab { bottom:16px; right:16px; width:60px; height:60px; }
      .whatsapp-fab svg { width:36px; height:36px; }
      .qr-overlay-link { 
        width: 28%; 
        height: 28%; 
        transform: translate(8%, 8%); 
      }
    }
  </style>
</head>
<body>

  <div class="gallery">

    <div class="card">
      <div class="image-wrapper" style="position: relative;">
        <div class="loader"><div class="spinner"></div></div>
        <img src="1.png" alt="Tarjeta con QR" loading="lazy"
             onload="this.parentElement.querySelector('.loader').classList.add('hidden')">

        <a href="https://tarjeta360empresarial-dotcom.github.io/Targeta/"
           target="_blank" rel="noopener noreferrer"
           class="qr-overlay-link"
           title="Visitar página web"
           aria-label="Abrir web desde el QR">
        </a>
      </div>
    </div>

  </div>
