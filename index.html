<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tarjeta 360 - Contacto</title>

  <style>
    :root {
      --primary: #25D366;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: sans-serif;
    }

    .gallery {
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      width: 100%;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }

    .image-wrapper:hover img {
      transform: scale(1.04);
    }

    .loader {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e5e7eb;
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .qr-overlay-link {
      position: absolute;
      bottom: 77%;
      right: 8%;
      width: 20%;
      height: 5%;
      transform: translate(10%, 10%);
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* ==================================================
        BOTONES FLOTANTES (GMAIL Y WHATSAPP)
    ================================================== */

    /* Botón WhatsApp */
    .whatsapp-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 68px;
      height: 68px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
      cursor: pointer;
      z-index: 9999;
      transition: var(--transition);
    }

    /* Botón Gmail */
    .gmail-fab {
      position: fixed;
      bottom: 24px;
      right: 104px; /* Separación del botón de WhatsApp */
      width: 68px;
      height: 68px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 9999;
      transition: var(--transition);
    }

    .whatsapp-fab:hover, .gmail-fab:hover {
      transform: scale(1.12) translateY(-4px);
    }

    .whatsapp-icon, .gmail-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    /* Ajustes para móviles */
    @media (max-width: 640px) {
      .whatsapp-fab {
        bottom: 16px;
        right: 16px;
        width: 60px;
        height: 60px;
      }
      .gmail-fab {
        bottom: 16px;
        right: 88px;
        width: 60px;
        height: 60px;
      }
      .whatsapp-icon, .gmail-icon {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="gallery">
    <div class="center">
      <div class="image-wrapper" style="position: relative;">
        <div class="loader"><div class="spinner"></div></div>
        
        <img src="1.png" alt="Tarjeta con QR" loading="lazy"
             onload="this.parentElement.querySelector('.loader').classList.add('hidden')">
        
        <a href="https://tarjeta360empresarial-dotcom.github.io/Targeta/"
           target="_blank" rel="noopener noreferrer"
           class="qr-overlay-link"
           title="Visitar página web">
        </a>
      </div>
    </div>
  </div>

  <a href="#" id="gmail-dynamic-btn" class="gmail-fab" target="_blank" rel="noopener noreferrer">
    <img src="gmail.png" alt="Gmail" class="gmail-icon">
  </a>

  <a href="https://wa.me/528332932881?text=Hola,%20estoy%20interesado"
     class="whatsapp-fab" target="_blank" rel="noopener noreferrer">
    <img src="WhatsApp.png" alt="WhatsApp" class="whatsapp-icon">
  </a>

  <script>
    (function() {
      const gmailBtn = document.getElementById('gmail-dynamic-btn');
      
      // Detectar si es móvil o tablet
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      
      const email = "yahirdelangel73@gmail.com";
      const subject = encodeURIComponent("Interesado en tus servicios");
      const body = encodeURIComponent("Hola, estoy interesado");

      // URL para PC (Interfaz web de Gmail)
      const desktopUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;
      
      // URL para Móvil (App nativa)
      const mobileUrl = `mailto:${email}?subject=${subject}&body=${body}`;

      // Asignar el link correspondiente
      gmailBtn.href = isMobile ? mobileUrl : desktopUrl;
    })();
  </script>

</body>
</html>
